name: Format Business Factory PR
on:
  push:
    branches:
      - feature/orbit-business-factory-v1
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write docs/business-factory-v1.md lib/business-factory.mjs server/app.ts src/business-factory.tsx src/studio.tsx tests/business-factory.test.mjs
      - name: Commit formatting to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/business-factory-v1.md lib/business-factory.mjs server/app.ts src/business-factory.tsx src/studio.tsx tests/business-factory.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format Business Factory files"
            git push origin HEAD:feature/orbit-business-factory-v1
          fi
